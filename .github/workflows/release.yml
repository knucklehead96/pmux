name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libvterm-dev tmux python3-pexpect file

      - name: Build release binaries
        run: scripts/release.sh

      - name: Check the version matches the tag
        run: |
          want="pmux ${GITHUB_REF_NAME#v}"
          for bin in dist/pmux-*-linux-x86_64 dist/pmux-*-linux-x86_64-static; do
            got=$("$bin" --version)
            if [ "$got" != "$want" ]; then
              echo "::error::$bin --version prints '$got', expected '$want'"
              exit 1
            fi
          done

      - name: Test the static binary
        run: |
          bin=$(ls dist/pmux-*-linux-x86_64-static)
          PMUX_FAST=1 PMUX_BIN="$PWD/$bin" tests/run.sh

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::no CHANGELOG.md section for $version"
            exit 1
          fi
          cat notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/pmux-* dist/SHA256SUMS \
            --title "pmux $GITHUB_REF_NAME" --notes-file notes.md
